<div class="ijp-form-card">
  <h2>Apply for this Position</h2>

  <div *ngIf="job" class="alert alert-info">
    Applying for <strong>{{ job.designationTitle }}</strong> — {{ job.location }} ({{ job.jobCode }})
  </div>

  <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <form *ngIf="!successMessage" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label">First Name</label>
      <input type="text" class="form-control" [(ngModel)]="firstName" name="firstName" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Last Name</label>
      <input type="text" class="form-control" [(ngModel)]="lastName" name="lastName" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Employee ID</label>
      <input type="text" class="form-control" [(ngModel)]="employeeId" name="employeeId" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Date of Birth</label>
      <input type="date" class="form-control" [(ngModel)]="dateOfBirth" name="dateOfBirth" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" [(ngModel)]="email" name="email" required>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="submitting">
      {{ submitting ? 'Submitting...' : 'Apply' }}
    </button>
    <button type="button" class="btn btn-secondary ms-2" (click)="onCancel()">Cancel</button>
  </form>
</div>
