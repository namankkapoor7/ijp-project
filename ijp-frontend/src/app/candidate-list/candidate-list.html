<div class="container mt-4">
  <button class="btn btn-outline-secondary btn-sm mb-3" (click)="goBack()">&larr; Back to Dashboard</button>

  <h2 *ngIf="job">Applicants for {{ job.designationTitle }} ({{ job.jobCode }})</h2>

  <div *ngIf="loading" class="text-muted">Loading candidates...</div>
  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <div *ngIf="!loading && !errorMessage && candidates.length === 0" class="text-muted">
    No candidates have applied to this posting yet.
  </div>

  <table class="table" *ngIf="!loading && candidates.length > 0">
    <thead>
      <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of candidates">
        <td>{{ c.firstName }}</td>
        <td>{{ c.lastName }}</td>
        <td>{{ c.email }}</td>
      </tr>
    </tbody>
  </table>
</div>
